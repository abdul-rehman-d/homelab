services:
  portainer:
    image: portainer/portainer-ce:2.45.1
    container_name: portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "${SERVER_LAN_IP:?Set SERVER_LAN_IP in .env}:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/portainer/data:/data
    networks:
      - infra
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "${SERVER_LAN_IP:?Set SERVER_LAN_IP in .env}:3000:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      HOMEPAGE_ALLOWED_HOSTS: "home.arowana-cat.ts.net,${SERVER_LAN_IP}:3000"
    volumes:
      - ../homepage:/app/config
    networks:
      - infra
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  infra:
    name: homelab-infra
