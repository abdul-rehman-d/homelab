services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "6000:8080"
    environment:
      TZ: Asia/Karachi
      SECURITY_ENABLELOGIN: "true"
      DISABLE_ADDITIONAL_FEATURES: "false"
      SYSTEM_DEFAULTLOCALE: en-US
      SYSTEM_GOOGLEVISIBILITY: "false"
      SYSTEM_MAXFILESIZE: "100"
      METRICS_ENABLED: "false"
      SHOW_SURVEY: "false"
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g

      # Conservative concurrency for the Chromebook's CPU and shared 8 GB RAM.
      PROCESSEXECUTOR_SESSIONLIMIT_LIBREOFFICESESSIONLIMIT: "1"
      PROCESSEXECUTOR_SESSIONLIMIT_TESSERACTSESSIONLIMIT: "1"
      PROCESSEXECUTOR_SESSIONLIMIT_GHOSTSCRIPTSESSIONLIMIT: "2"
      PROCESSEXECUTOR_SESSIONLIMIT_IMAGEMAGICKSESSIONLIMIT: "2"
      PROCESSEXECUTOR_SESSIONLIMIT_PYTHONOPENCVSESSIONLIMIT: "2"
      PROCESSEXECUTOR_SESSIONLIMIT_WEASYPRINTSESSIONLIMIT: "4"
      PROCESSEXECUTOR_SESSIONLIMIT_QPDFSESSIONLIMIT: "1"
      PROCESSEXECUTOR_SESSIONLIMIT_OCRMYPDFSESSIONLIMIT: "1"
      PROCESSEXECUTOR_TIMEOUTMINUTES_LIBREOFFICETIMEOUTMINUTES: "10"
      PROCESSEXECUTOR_TIMEOUTMINUTES_TESSERACTTIMEOUTMINUTES: "15"
    volumes:
      - /srv/stirling-pdf/tessdata:/usr/share/tessdata:rw
      - /srv/stirling-pdf/configs:/configs:rw
      - /srv/stirling-pdf/logs:/logs:rw
      - /srv/stirling-pdf/custom-files:/customFiles:rw
      - /srv/stirling-pdf/pipeline:/pipeline:rw
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8080/api/v1/info/status | grep -q 'UP'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 3g
    cpus: "2.0"
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - homelab-proxy

networks:
  homelab-proxy:
    external: true
